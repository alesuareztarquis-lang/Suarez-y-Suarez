<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suarez y Suarez SL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--panel:#151515;--line:#262626;--text:#f5f2ec;--muted:#a8a39a;--accent:#ff9a1f;--accent-ink:#140b00;
  --cut:clamp(18px,3vw,36px);color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--panel:#151515;--line:#262626;--text:#f5f2ec;--muted:#a8a39a}}
:root[data-theme="dark"]{--bg:#0a0a0a;--panel:#151515;--line:#262626;--text:#f5f2ec;--muted:#a8a39a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 "Barlow",system-ui,sans-serif;overflow-x:hidden}
h1,h2,.sport{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.95;margin:0;letter-spacing:.005em}
a{color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}

/* Barra superior */
.top{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.top img{height:44px;width:auto;border-radius:6px;background:#fff;display:block}
.top .name{font-size:22px}
.top nav{margin-left:auto;display:flex;gap:22px}
.top nav a{text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}.top nav a:hover{color:var(--accent)}
.cta{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:500;padding:12px 26px;transform:skewX(-14deg)}
.cta span{display:inline-block;transform:skewX(14deg)}
.cta.ghost{background:none;color:var(--text);box-shadow:inset 0 0 0 2px var(--accent)}

/* Portada */
.hero{--vw:min(70vw,940px);position:relative;overflow:hidden;padding:84px 0 56px;min-height:calc(190px + var(--vw)*.667);
  background:linear-gradient(115deg,transparent 40%,var(--accent) 40%,var(--accent) 47%,transparent 47%,transparent 50%,var(--accent) 50%,var(--accent) 52%,transparent 52%),radial-gradient(circle at 15% 20%,#1f1405,var(--bg) 60%)}
.hero .wrap{position:relative;z-index:2}
.hero .txt{max-width:min(760px,100%)}
.hero .logo-card{max-width:190px;margin-top:40px}
.hero h1,.hero p{text-shadow:0 2px 18px rgba(0,0,0,.65)}
/* Coche: queda debajo del texto; las luces siguen al scroll */
.coche{position:absolute;right:0;top:150px;z-index:1;display:block;width:var(--vw);height:auto;pointer-events:none;filter:brightness(.9) contrast(1.05);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 34%),linear-gradient(to bottom,transparent,#000 24%,#000 80%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 34%),linear-gradient(to bottom,transparent,#000 24%,#000 80%,transparent);mask-composite:intersect}
.hero h1{font-size:clamp(36px,5.8vw,74px)}
.anios{display:inline-block;margin:0 0 22px;background:var(--accent);color:var(--accent-ink);padding:6px 22px;font-size:clamp(20px,2.7vw,32px);line-height:1.1;transform:skewX(-14deg)}
.anios span{display:inline-block;transform:skewX(14deg)}
.hero h1 em{color:var(--accent);font-style:inherit}
.hero p{max-width:50ch;color:#cfcac1;font-size:19px;margin:26px 0 34px}
.btns{display:flex;flex-wrap:wrap;gap:16px}
.logo-card{background:#fff;padding:18px;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));box-shadow:0 0 0 6px var(--accent)}
.logo-card img{width:100%;display:block}

/* Franja */
.strip{background:var(--accent);color:var(--accent-ink);margin:24px 0 0;position:relative;z-index:2}
.strip div{max-width:1140px;margin:0 auto;padding:16px 24px;display:flex;flex-wrap:wrap;gap:6px 30px;font-size:22px;justify-content:center}

/* Logo como publicidad en el lateral del coche */
.coche-logo{position:absolute;right:0;top:150px;z-index:1;width:var(--vw);aspect-ratio:1198/798;pointer-events:none}
.coche-logo .pegatina{position:absolute;left:41.7%;top:47%;width:11%;aspect-ratio:1;border-radius:50%;transform:perspective(520px) rotateY(58deg) rotate(-3deg);opacity:.95;filter:brightness(.9) contrast(1.05)}
.coche-logo .pegatina img{position:absolute;inset:0;width:100%;height:100%;display:block}
.coche-logo .pegatina::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,rgba(255,255,255,.38),rgba(255,255,255,0) 40%,rgba(0,0,0,.28))}
